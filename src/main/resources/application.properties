# Server configuration
server.port=${PORT:8080}
server.servlet.context-path=/api/v1.0

# MongoDB Configuration - Reads MONGODB_URI (Render/Atlas), falls back to SPRING_DATA_MONGODB_URI or local instance for dev
spring.data.mongodb.uri=${MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/cloudfileshare}}

# Exclude auto security user details service
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# File upload configuration
file.upload.dir=${FILE_UPLOAD_DIR:upload}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:25MB}

# Clerk configuration
clerk.issuer=${CLERK_ISSUER:}
clerk.jwks-url=${CLERK_JWKS_URL:}
clerk.webhook.secret=${CLERK_WEBHOOK_SECRET:}

# Razorpay configuration
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# CORS Allowed Origins (comma-separated list of origins)
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:${ALLOWED_ORIGINS:https://cloudfileshare.netlify.app,http://localhost:5173,http://localhost:3000}}
